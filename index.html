<!DOCTYPE html>

<head>

  <title>WhatsApp Helper</title>

      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 12px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    textarea, input, select, button {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    button {
      background: #25d366;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #128c7e;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .controls button {
      flex: 1;
    }
    #saved {
      margin-top: 15px;
    }
    .saved-item {
      background: #333;
      padding: 6px 10px;
      border-radius: 6px;
      margin: 4px 0;
      cursor: pointer;
    }
    .saved-item:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WhatsApp Helper</h1>
    <label>Phone number (with country code):</label>
    <input id="phone" placeholder="+2348012345678">

    <label>Choose template:</label>
    <select id="template">
      <option value="secure">Secure Account</option>
      <option value="unban">Unban Request</option>
      <option value="ban">Ban Warning (for scammers)</option>
      <option value="report">Report Scammer</option>
      <option value="custom">Custom (from saved)</option>
    </select>
    <button id="loadSample">Load Template</button>

    <label>Message:</label>
    <textarea id="message"></textarea>

    <div class="controls">
      <button id="openWa">Open in WhatsApp</button>
      <button id="copy">Copy</button>
      <button id="save">Save Template</button>
      <button id="clear">Clear</button>
      <button id="resetAll">Reset Saved</button>
    </div>

    <div id="saved"></div>
  </div>

    // elements
    const phoneEl = document.getElementById('phone');
    const templateEl = document.getElementById('template');
    const loadSampleBtn = document.getElementById('loadSample');
    const messageEl = document.getElementById('message');
    const openBtn = document.getElementById('openWa');
    const copyBtn = document.getElementById('copy');
    const saveBtn = document.getElementById('save');
    const savedDiv = document.getElementById('saved');
    const clearBtn = document.getElementById('clear');
    const resetAllBtn = document.getElementById('resetAll');

    // --- NEW: send email button ---
    const emailBtn = document.createElement("button");
    emailBtn.textContent = "Send as Email (Gmail)";
    document.querySelector(".controls").appendChild(emailBtn);

    emailBtn.addEventListener("click", () => {
      const text = messageEl.value.trim();
      if (!text) {
        alert("Please enter a message first.");
        return;
      }
      const subject = "WhatsApp Account Support";
      const mailto = `mailto:support@whatsapp.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
      window.location.href = mailto; 
    });

    // localStorage key
    const STORAGE_KEY = 'wa_helper_templates_v1';

    function loadSaved(){
      const raw = localStorage.getItem(STORAGE_KEY);
      let arr = [];
      try{ arr = raw ? JSON.parse(raw) : []; }catch(e){ arr = []; }
      savedDiv.innerHTML = '';
      arr.forEach((t, idx)=>{
        const el = document.createElement('div');
        el.className = 'saved-item';
        el.textContent = t.name;
        el.addEventListener('click', ()=> {
          messageEl.value = t.text;
          templateEl.value = 'custom';
        });
        el.addEventListener('contextmenu', (ev)=>{
          ev.preventDefault();
          if(confirm('Delete template "'+t.name+'"?')) {
            arr.splice(idx,1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
            loadSaved();
          }
        });
        savedDiv.appendChild(el);
      });
    }

    // initial load
    loadSaved();

    loadSampleBtn.addEventListener('click', ()=>{
      const choice = templateEl.value;
      if(choice === 'secure') {
        messageEl.value = SAMPLES.secure;
      }
      else if(choice === 'unban') {
        messageEl.value = SAMPLES.unban;
      }
      else if(choice === 'ban') {
        let phone = phoneEl.value.trim();
        if(phone){
          messageEl.value = `⚠️ Important Notice

The number ${phone} has been reported for suspicious/scam activities. 
If you continue, WhatsApp may permanently ban your account. 
Avoid sending spam, bulk messages, or fake promotions. 
Stay safe and follow WhatsApp rules.`;
        } else {
          messageEl.value = SAMPLES.banBase;
        }
      }
      else if(choice === 'report') {
        messageEl.value = SAMPLES.report;
      }
      else{
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        if(arr.length) messageEl.value = arr[0].text;
        else messageEl.value = '';
      }
    });

    openBtn.addEventListener('click', ()=>{
      let phone = phoneEl.value.trim().replace(/[^0-9]/g,'');
      const text = messageEl.value.trim();
      if(!text){
        alert('Please enter a message first.');
        return;
      }
      if(!phone){
        const url = 'https://web.whatsapp.com/send?text=' + encodeURIComponent(text);
        window.open(url, '_blank');
        return;
      }
      const waUrl = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
      window.open(waUrl, '_blank');
    });

    copyBtn.addEventListener('click', async ()=>{
      const txt = messageEl.value;
      if(!txt) { alert('Nothing to copy'); return; }
      try{
        await navigator.clipboard.writeText(txt);
        alert('Message copied to clipboard');
      }catch(e){
        messageEl.select();
        document.execCommand('copy');
        alert('Copied (fallback)');
      }
    });

    saveBtn.addEventListener('click', ()=>{
      const name = prompt('Template name (short):');
      const text = messageEl.value.trim();
      if(!name || !text) { alert('Provide both name and message'); return; }
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      arr.unshift({name: name.slice(0,40), text});
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      loadSaved();
    });

    clearBtn.addEventListener('click', ()=>{ if(confirm('Clear message?')) messageEl.value = ''; });

    resetAllBtn.addEventListener('click', ()=>{
      if(confirm('Delete all saved templates?')) {
        localStorage.removeItem(STORAGE_KEY); loadSaved();
      }
    });

    // convenience: load secure by default
    if(!messageEl.value) messageEl.value = SAMPLES.secure;
  </script>
</body>
</html>
